[package]
name = "asm-lsp"
publish = true
edition.workspace = true
version.workspace = true
authors.workspace = true
description.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true

[lib]
name = "asm_lsp"
path = "lib.rs"

[[bin]]
name = "asm-lsp"
path = "bin/main.rs"

[dependencies]
anyhow.workspace = true
bincode.workspace = true
serde.workspace = true
dirs.workspace = true
toml.workspace = true
clap.workspace = true
serde_json.workspace = true
schemars.workspace = true
# write to stderr instead of stdout
flexi_logger = "0.31.10"
log = { version = "0.4.34" }
lsp-server = "0.10.0"
lsp-types = "0.97.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["blocking"] }
strum = "0.28.0"
strum_macros = "0.28.0"
home = "0.5.12"
symbolic = { version = "13.9.0", features = ["demangle"] }
symbolic-demangle = "13.9.0"
url-escape = "0.1.2"
quick-xml = "0.42.0"
lsp-textdocument = "0.5.0"
# TODO: Upgrade to 0.25.3
tree-sitter = "0.27.0"
tree-sitter-asm = "0.24.0"
compile_commands = "0.3.0"
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
htmlentity = "1.3.2"

[dev-dependencies]
mockito = "1.7.2"

[lints]
workspace = true
